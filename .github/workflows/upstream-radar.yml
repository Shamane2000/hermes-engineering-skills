name: Upstream Skill Radar (addyosmani & superpowers)

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream repositories for recent commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess, urllib.request
          from datetime import datetime, timedelta, timezone

          since = (datetime.now(timezone.utc) - timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ")
          upstreams = ["addyosmani/agent-skills", "obra/superpowers"]
          updates = []

          for repo in upstreams:
              url = f"https://api.github.com/repos/{repo}/commits?since={since}&per_page=10"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github.v3+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "User-Agent": "hermes-engineering-skills-radar"
              })
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      commits = json.loads(resp.read().decode("utf-8"))
                  if commits:
                      lines = [f"### `{repo}` ({len(commits)} new commit(s) in the last 7 days)"]
                      for c in commits:
                          sha = c["sha"][:7]
                          msg = c["commit"]["message"].splitlines()[0]
                          html_url = c["html_url"]
                          lines.append(f"- [`{sha}`]({html_url}): {msg}")
                      updates.append("
".join(lines))
              except Exception as e:
                  print(f"Warn: failed to check {repo}: {e}")

          if updates:
              body = (
                  "## Upstream Engineering Skills Update Radar

"
                  "New commits were detected in tracked upstream repositories. "
                  "Review whether any new patterns or checks should be ported to Hermes-native format "
                  "(following `hermes-agent-skill-authoring` hardline rules & deterministic `scripts/` gates):

"
                  + "

".join(updates)
              )
              subprocess.run([
                  "gh", "issue", "create",
                  "--title", f"[Upstream Radar] New upstream skill updates ({datetime.now(timezone.utc).strftime('%Y-%m-%d')})",
                  "--body", body
              ], check=False)
          else:
              print("No upstream commits in the last 7 days.")
          PYEOF
